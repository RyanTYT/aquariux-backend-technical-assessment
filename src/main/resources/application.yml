spring:
  application:
    name: aquariux-backend
  threads:
    virtual:
      # Tomcat request handling and Spring stack on virtual threads: 100
      # simultaneous trades no longer compete for platform carrier threads,
      # which keeps tail latency (p99) from bloating under burst load.
      enabled: true
  datasource:
    url: jdbc:h2:mem:aquariux
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # Business target: >= 100 simultaneous trades. Each in-flight trade
      # holds exactly one connection for its transaction; with the default
      # pool of 10 the remaining ~90 requests only wait on the pool, which
      # dominates trade latency under burst load. Size matches the target.
      maximum-pool-size: 100
      minimum-idle: 100
  h2:
    console:
      enabled: true
      path: /h2-console
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aquariux.technical.assessment.trade.entity
  configuration:
    map-underscore-to-camel-case: true
